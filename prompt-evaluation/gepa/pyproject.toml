[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazygoal-gepa-adapter"
version = "0.1.0"
description = "Official GEPA adapter for LazyGoal Prompt Evaluation"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gepa==0.1.4",
    "jinja2>=3.1.0",
]

[project.scripts]
lazygoal-gepa-smoke = "lazygoal_gepa.smoke:main"
lazygoal-gepa-lifecycle-smoke = "lazygoal_gepa.smoke:main"
lazygoal-gepa-gaia-e2e = "lazygoal_gepa.gaia_e2e:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
