name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            benchmarks/package-lock.json
            packages/*/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.9.5
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: prompt-evaluation/gepa/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install npm dependencies
        run: |
          npm ci
          for lockfile in apps/*/package-lock.json benchmarks/package-lock.json packages/*/package-lock.json; do
            if [ -f "$lockfile" ]; then
              npm ci --prefix "${lockfile%/package-lock.json}"
            fi
          done

      - name: Check sandbox and browser
        run: |
          test -x /usr/bin/sandbox-exec
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Run regression tests
        env:
          CI: 'true'
        run: npm test

      - name: Typecheck Goal Server
        run: npx tsc --noEmit -p apps/goal-server/tsconfig.json

      - name: Build Web app
        run: npm run build:web

      - name: Run browser acceptance tests
        run: node --test --test-concurrency=1 apps/goal-board/e2e/*.test.mjs
